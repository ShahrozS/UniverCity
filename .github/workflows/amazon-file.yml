name: Deploy Springboot to AWS EC2

on:
  push:
    branches: [ main ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up JDK 17
      uses: actions/setup-java@v3
      with:
        java-version: '17'
        distribution: 'adopt'
        
    - name: Build with Maven
      run: mvn -B package --file pom.xml
      
    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v1
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: us-east-1
        
    - name: Copy JAR to EC2
      env:
        EC2_HOST: ${{ secrets.EC2_HOST }}
        EC2_PRIVATE_KEY: ${{ secrets.EC2_PRIVATE_KEY }}
      run: |
        echo "$EC2_PRIVATE_KEY" > springboot.pem
        chmod 600 springboot.pem
        scp -o StrictHostKeyChecking=no -i springboot.pem target/*.jar ec2-user@$EC2_HOST:~/app.jar
        ssh -o StrictHostKeyChecking=no -i springboot.pem ec2-user@$EC2_HOST 'bash -s' < deploy.sh
        rm -f springboot.pem