version: "3.9"

services:
  springboot-app:
    container_name: univercity-app
    image: shahrozsalman7@gmail.com/univercity-app:latest
    ports:
      - "80:8088"
    depends_on:
      - postgres
      - redis
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/UniverCity
      SPRING_DATASOURCE_USERNAME: username
      SPRING_DATASOURCE_PASSWORD: password
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      ACTIVATION_URL: -/activate-account
      CORS_ALLOWED_ORIGINS: -
      SERVER_FORWARD-HEADERS-STRATEGY: NATIVE
    networks:
      - spring-demo
    restart: unless-stopped

  postgres:
    container_name: postgres-sql-uc
    image: postgres:17.2
    environment:
      POSTGRES_USER: username
      POSTGRES_PASSWORD: password
      PGDATA: /var/lib/postgresql/data
      POSTGRES_DB: UniverCity
    volumes:
      - postgres:/var/lib/postgresql/data
    expose:
      - "5432"
    networks:
      - spring-demo
    restart: unless-stopped
    command: postgres -c shared_buffers=128MB -c max_connections=20

  redis:
    container_name: redis-cache
    image: redis:7-alpine
    expose:
      - "6379"
    networks:
      - spring-demo
    restart: unless-stopped
    volumes:
      - redis-data:/data
    command: redis-server --maxmemory 128mb --maxmemory-policy allkeys-lru

networks:
  spring-demo:
    driver: bridge

volumes:
  postgres:
    driver: local
  redis-data:
    driver: local
