<header class="   bg-slate-950  ">
  <div class="container mx-auto px-4 py-3">
    <div class="flex items-center justify-between">
      <div class="flex items-center space-x-8">
        <a href="/home" (click)="home()" class="flex items-center mb-0 text-xl font-semibold text-gray-900 dark:text-white">
          <img class="w-8  h-8 mr-2" src="https://flowbite.s3.amazonaws.com/blocks/marketing-ui/logo.svg" alt="logo">
          UniverCity
        </a>
        <nav class="flex items-center space-x-6 font-medium text-base">
          <a href="#" [routerLink]="'/rsquestionnaire'" class ="flex items-center text-gray-100 hover:text-gray-300">Decide</a>
          <a href="#"  [routerLink]="'/quiz-category'" class="flex items-center text-gray-100 hover:text-gray-300">Mock Test</a>
          <a href="#"  [routerLink]="'/favourite-universities'" class="flex items-center text-gray-100 hover:text-gray-300">Favorite Universities</a>
          <a href="#"  [routerLink]="'/previous-quiz'" class="flex items-center text-gray-100 hover:text-gray-300">Past Quiz</a>
          <a href="#"  [routerLink]="'/custom-timetable'" class="flex items-center text-gray-100 hover:text-gray-300">Timetable</a>
        
        </nav>
      </div>

      <div class="flex items-center space-x-8">


        <div class="flex items-center space-x-8 ml-4">
         
          <div>
            <app-notifications></app-notifications>
          </div>

          <button (click)="logout()">
            <fa-icon class ="text-gray-100 text-2xl hover:text-gray-300" [icon]="faSignOut"></fa-icon>
        </button>
        <button >
          <fa-icon  [routerLink]="'/user-profile'" class ="text-gray-100 text-2xl hover:text-gray-300" [icon]="faUser"></fa-icon>
        </button>
      
        </div>
      </div>
    </div>
  </div>
</header>
