<!-- proctoring.component.html -->
<app-navbar></app-navbar>


<div class="proctoring-container">
  <div class="header">
    <h2>Test Proctoring System</h2>
  </div>
  
  <div class="content">
    <div *ngIf="loadingModels" class="loading-section">
      <div class="spinner"></div>
      <p>Loading face detection models...</p>
    </div>
    
    <div *ngIf="errorMessage" class="error-section">
      <div class="alert alert-danger">
        {{ errorMessage }}
      </div>
      <button class="btn btn-primary" (click)="startCamera()">Try Again</button>
    </div>
    
    <div *ngIf="!loadingModels && !errorMessage" class="camera-section">
      <div class="video-container">
        <video #video id="video" [hidden]="!cameraReady" width="640" height="480" autoplay muted></video>
        <canvas #canvas id="canvas" width="640" height="480"></canvas>
        
        <div *ngIf="!cameraReady" class="camera-placeholder">
          <i class="fa fa-camera"></i>
          <p *ngIf="!loading">Camera not started</p>
          <div *ngIf="loading" class="animate-spin rounded-full h-6 w-6 border-t-4 border-white"></div>

        </div>

      </div>
      
      <div class="status-indicators">
        <div class="indicator" [ngClass]="{'active': cameraReady}">
          <i class="fa" [ngClass]="{'fa-check': cameraReady, 'fa-times': !cameraReady}"></i>
          Camera Ready
        </div>
        <div class="indicator" [ngClass]="{'active': faceDetected}">
          <i class="fa" [ngClass]="{'fa-check': faceDetected, 'fa-times': !faceDetected}"></i>
          Face Detected
        </div>
        <div class="indicator" [ngClass]="{'active': sufficientLight}">
          <i class="fa" [ngClass]="{'fa-check': sufficientLight, 'fa-times': !sufficientLight}"></i>
          Sufficient Light
        </div>
      </div>
      
      <div class="actions">
        <button *ngIf="!cameraReady" class="btn btn-primary" (click)="startCamera()">
          Start Camera
        </button>
        
        <button *ngIf="cameraReady && !testStarted" class="btn btn-success" 
                [disabled]="!faceDetected || !sufficientLight"
                (click)="startTest()">
          Start Test
        </button>
      </div>
      
      <div *ngIf="testStarted" class="test-status">
        <div class="alert alert-info">
          <p><strong>Test in progress.</strong> Please remain in view of the camera.</p>
        </div>
      </div>
    </div>
  </div>
</div>
