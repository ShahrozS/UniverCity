<div class="quiz-container bg-white min-h-screen flex flex-col items-center p-6">
    
  <!-- Sticky Timer -->
  <div class="timer-container flex justify-between items-center sticky top-0 w-full bg-gray-900 text-black text-center p-4 text-2xl font-bold shadow-lg">
   
    <!-- Left-aligned button -->
    <button (click)="goBack()" class="bg-blue-400 rounded-2xl text-lg text-white py-2 px-4">Go Back</button>
  
    <!-- Center-aligned text with flex-grow -->
    <p *ngIf="mode === 'Timed'" class="text-center flex-grow  text-black">Time Left: {{ timer }}</p>
  
  </div>
  

  <!-- Quiz Form -->
  <form [formGroup]="quizForm" (ngSubmit)="onSubmit()" class="w-full  max-w-3xl">
    
    <div class="sections-container space-y-12">
      <ng-container *ngFor="let subCategory of subCategories; let subIndex  = index " >
        
        <!-- Section Title -->
        <div class="section-title bg-gray text-4xl font-extrabold text-gray-900 text-center border-b-4 border-black pb-4 mb-8">
          <h2>{{ subCategory.name }}</h2>
        </div>

        <ng-container *ngFor="let question of getQuestionsForSection(subCategory.quizsubcategory_id ?? 0); let qIndex = index ">
          
          <!-- Question Card -->
          <div class="question-container p-6 bg-white border-4 border-black rounded-2xl shadow-lg">
            <div class="question-content">
              <h3 class="text-3xl font-bold text-gray-800 mb-4">Question {{ qIndex + 1 + getPreviousQuestionsCount(subIndex) }}</h3>
              <p class="question-text text-xl font-semibold text-gray-700 mb-6">{{ question.question }}</p>
              
              <!-- Options -->
              <div class="options-container grid grid-cols-1 md:grid-cols-2 gap-4">
                <ng-container *ngFor="let optionIndex of [1,2,3,4]">
                  <div 
                       class="option-card bg-white border-4 border-black rounded-xl p-4 text-lg font-semibold flex items-center cursor-pointer transition-all hover:bg-gray-200"
                       [class.selected]="isOptionSelected(question.quizquestion_id??1, optionIndex)">
                    <label [for]="'q' + question.quizquestion_id + 'opt' + optionIndex" class="w-full flex items-center gap-4">
                      <input type="radio" 
                             [id]="'q' + question.quizquestion_id + 'opt' + optionIndex"
                             [formControlName]="'question' + question.quizquestion_id"
                             [value]="optionIndex"
                             class="hidden"
                             (change)="onOptionSelect(question.quizquestion_id ?? 1, optionIndex)">
                      <span class="w-6 h-6 flex justify-center items-center border-4 border-black rounded-full">
                        <span class="w-3 h-3 bg-black rounded-full" *ngIf="isOptionSelected(question.quizquestion_id ?? 1, optionIndex)"></span>
                      </span>
                      <span class="option-text">{{ getOptionText(question, optionIndex) }}</span>
                    </label>
                  </div>
                </ng-container>
              </div>
              
            </div>
          </div>

        </ng-container>
      </ng-container>
    </div>

    <!-- Submit Button -->
    <div class="submit-container flex justify-end mt-12">
      <button type="submit" class="submit-btn bg-white border-4 border-black text-2xl font-bold py-4 px-8 rounded-xl shadow-lg hover:bg-gray-200 transition-all">
        Submit Quiz
      </button>
    </div>
  </form>
</div>
