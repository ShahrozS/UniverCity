<div class="quiz-container bg-white min-h-screen flex flex-col items-center p-6">
    
  <!-- Sticky Timer -->
  <div class="timer-container sticky top-0 w-full bg-gray-900 text-black text-center p-4 text-2xl font-bold shadow-lg">
    Time Left: {{ timer }}
  </div>

  <!-- Quiz Form -->
  <form [formGroup]="quizForm" (ngSubmit)="onSubmit()" class="w-full  max-w-3xl">
    
    <div class="sections-container space-y-12">
      <ng-container *ngFor="let section of sections">
        
        <!-- Section Title -->
        <div class="section-title bg-gray text-4xl font-extrabold text-gray-900 text-center border-b-4 border-black pb-4 mb-8">
          <h2>{{ section.title }}</h2>
        </div>

        <ng-container *ngFor="let question of getQuestionsForSection(section.id)">
          
          <!-- Question Card -->
          <div class="question-container p-6 bg-white border-4 border-black rounded-2xl shadow-lg">
            <div class="question-content">
              <h3 class="text-3xl font-bold text-gray-800 mb-4">Question {{ question.id }}</h3>
              <p class="question-text text-xl font-semibold text-gray-700 mb-6">{{ question.text }}</p>
              
              <!-- Options -->
              <div class="options-container grid grid-cols-1 md:grid-cols-2 gap-4">
                <div *ngFor="let option of question.options; let i = index" 
                     class="option-card bg-white border-4 border-black rounded-xl p-4 text-lg font-semibold flex items-center cursor-pointer transition-all hover:bg-gray-200"
                     [class.selected]="isOptionSelected(question.id, i)">
                  <label [for]="'q' + question.id + 'opt' + i" class="w-full flex items-center gap-4">
                    <input type="radio" 
                           [id]="'q' + question.id + 'opt' + i"
                           [formControlName]="'question' + question.id"
                           [value]="i"
                           class="hidden"
                           (change)="onOptionSelect(question.id, i)">
                    <span class="w-6 h-6 flex justify-center items-center border-4 border-black rounded-full">
                      <span class="w-3 h-3 bg-black rounded-full" *ngIf="isOptionSelected(question.id, i)"></span>
                    </span>
                    <span class="option-text">{{ option }}</span>
                  </label>
                </div>
              </div>
            </div>
          </div>

        </ng-container>
      </ng-container>
    </div>

    <!-- Submit Button -->
    <div class="submit-container flex justify-end mt-12">
      <button type="submit" class="submit-btn bg-white border-4 border-black text-2xl font-bold py-4 px-8 rounded-xl shadow-lg hover:bg-gray-200 transition-all">
        Submit Quiz
      </button>
    </div>
  </form>
</div>
