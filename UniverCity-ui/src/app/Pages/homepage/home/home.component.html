<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>University Search Pakistan</title>
  <style>
  
  </style>
</head>
<body>
  <app-navbar class="navbar">
  </app-navbar>

  <section class="hero-section">
    <div class="hero-pattern"></div>
    <div class="container">
      <div class="hero-content">
        <h1 class="hero-title">Bachelor's Degrees from All Over Pakistan</h1>
        <p class="hero-subtitle">Find the perfect university and program for your future. Explore top institutions across Pakistan.</p>
      </div>
    </div>
  </section>

  <div class="container">
    <div class="main-content">
      <div class="filters-panel">
        <h5 class="filters-title ">Filters</h5>
        <app-filters (filtersChanged)="onFiltersChanged($event)"></app-filters>
      </div>

      <div class="search-results">
        <div class="search-box">
          <div class="search-input-container">
            <input type="search" id="default-search" class="search-input" placeholder="Search by Name, Program..." 
                  #searchInput [(ngModel)]="searchText" required>
            <button type="button" class="search-button" (click)="searchUni(searchInput.value)">
              Search
            </button>
          </div>
        </div>

        <div class="university-list">
        <app-university-list class="university-list"></app-university-list>

        </div>
        
   
        </div>
    </div>
  </div>
</body>
</html>
