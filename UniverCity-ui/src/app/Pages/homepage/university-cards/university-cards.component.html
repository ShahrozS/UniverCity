<div 
  class="card w-full max-w-full min-w-full  py-16"
  [class.selected]="isSelected" 
  (click)="toggleSelection()"
>


<div class="header flex items-center flex-row justify-between ">
  <h3 class="card-title mt-5 " style="width: 80%;">{{ university?.name }}</h3>
  
  <fa-icon 
  class="heart z-10 mr-5 mt-2 cursor-pointer text-2xl p-2 relative"
  [class.heart-inactive]="isFavorite"
  (click)="favUni($event)"
  [icon]="faHeart">
</fa-icon>




</div>


<!-- main box -->
<div class="main  flex flex-row" style="height: 150px;">


<!-- leftsection -->

<div class="left  flex flex-col " style="width: 50%;">
  
  <div class="accredation  font-light">
    <p class="">Accredited by {{university?.accrediatetionBody}}<span class="text-orange-500 font-medium text-lg">/</span>Public University</p>
    <p class="bg-lime-300 w-[8rem] text-center rounded-full text-sm p-1 px-2 mt-2">Ranked at <b>#{{university?.rank}}</b> </p>
  </div>
 
  <div class="align-self-end mt-2">
    <a 
    target="_blank"
    href="{{university?.websiteLink}}" 
    class="underline  text-purple-900 self-end"
  >
    Visit Website
  </a>
  </div>

</div>



<!-- rijht section -->

<div class="right h-full  flex mt-2 justify-end mr-5 " style="width: 50%;">

  <div class="avgFees  flex items-end flex-col ">
    <p class="font-bold">~ {{university?.averageFees}} PKR /semester</p>
    <p class="font-bold mb-8">8 Semesters</p>
    
    
    <button 
    (click)="viewDetails()" 
    class="w-26 self-end  p-2 font-semibold hover:bg-yellow-500 rounded-md bg-yellow-300"
  >
    View Details
  </button>
  </div>

 
</div>

</div>

  <!-- View Details Button -->
 
</div>
