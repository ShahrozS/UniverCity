<div class="mt-1 ml-5">
  <button
    class="bg-blue-500 text-white px-4 py-2 rounded disabled:opacity-50"
    [disabled]="selectedUniversities.length !== 2"
    (click)="compareUniversities()">
    Compare Selected Universities
  </button>
</div>

<!-- Show loader while universities are being fetched -->
<div *ngIf="loading" class="loading-container">
  <div class="custom-spinner"></div>
</div>

<!-- Show "No universities available" if empty -->
<div *ngIf="!loading && filteredUniversities.length === 0" class="no-universities">
  <div class="no-universities-card">
    <h2>No Universities Available</h2>
    <p>Try adjusting your filters or searching again.</p>
  </div>
</div>

<!-- Display university cards when data is available -->
<div class="card-container" *ngIf="!loading && filteredUniversities.length > 0">
  <app-university-cards
    *ngFor="let university of filteredUniversities; trackBy: trackByUniversity;"
    [university]="university"
    (selectionChanged)="onCardSelectionChange($event)">
  </app-university-cards>
</div>

<!-- Pagination controls -->
<div class="pagination-controls" *ngIf="!loading && totalPages > 1">
  <button 
    class="pagination-button"
    [disabled]="isFirstPage"
    (click)="previousPage()">
    Previous
  </button>
  
  <div class="page-numbers">
    <ng-container *ngFor="let page of [].constructor(totalPages); let i = index">
      <button 
        class="page-number" 
        [class.active]="i === currentPage"
        (click)="goToPage(i)">
        {{ i + 1 }}
      </button>
    </ng-container>
  </div>
  
  <button 
    class="pagination-button"
    [disabled]="isLastPage"
    (click)="nextPage()">
    Next
  </button>
</div>

<div class="pagination-info" *ngIf="!loading && filteredUniversities.length > 0">
  Showing {{ currentPage * pageSize + 1 }} - 
  {{ (currentPage * pageSize) + filteredUniversities.length }} of {{ totalElements }} universities
</div>
