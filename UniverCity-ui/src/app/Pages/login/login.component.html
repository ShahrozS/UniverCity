<section class="min-h-screen bg-gradient-to-b from-gray-50 to-gray-100 dark:from-gray-900 dark:to-gray-800 py-10 px-4 sm:px-6 md:px-10">
  <div class="max-w-md mx-auto">
    <!-- Header with logo -->
    <div class="text-center mb-8">
      <div class="flex items-center justify-center">
        <img class="h-10 w-10" src="https://flowbite.s3.amazonaws.com/blocks/marketing-ui/logo.svg" alt="UniverCity logo">
      </div>
      <h1 class="mt-3 text-2xl font-bold text-gray-900 dark:text-white">UniverCity</h1>
      <p class="mt-1 text-sm text-gray-500 dark:text-gray-400">Sign in to your account</p>
    </div>

    <!-- Card container -->
    <div class=" dark:bg-gray-800 rounded-xl w-[28rem] shadow-lg overflow-hidden">
      <!-- Form content -->
      <div class="p-6 sm:p-8">
        <!-- Error Messages -->
        <div *ngIf="errorMsg.length" class="p-4 mb-6 text-sm text-red-800 rounded-lg bg-red-50 dark:bg-gray-700 dark:text-red-400" role="alert">
          <div class="font-medium">Please fix the following errors:</div>
          <ul class="mt-1.5 ml-4 list-disc list-inside">
            <li *ngFor="let msg of errorMsg">{{msg}}</li>
          </ul>
        </div>

        <form [formGroup]="loginForm" class="space-y-5">
          <!-- Email -->
          <div>
            <label for="email" class="block mb-1.5 text-sm font-medium text-gray-700 dark:text-gray-300">
              Email <span class="text-red-600">*</span>
            </label>
            <div class="relative bg-gray-700">
              <div class="absolute inset-y-0 left-0 flex items-center pl-3 pointer-events-none">
                <svg class="w-5 h-5 text-gray-500 dark:text-gray-400" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 12a4 4 0 10-8 0 4 4 0 008 0zm0 0v1.5a2.5 2.5 0 005 0V12a9 9 0 10-9 9m4.5-1.206a8.959 8.959 0 01-4.5 1.207" />
                </svg>
              </div>
              <input 
                formControlName="email"
                type="email" 
                id="email" 
                placeholder="name@example.com" 
                class="w-full pl-10 pr-4 py-2.5 focus:bg-gray-700  dark:bg-gray-700 border border-gray-300 dark:border-gray-600 rounded-lg focus:ring-2 focus:ring-primary-500 focus:border-primary-500 transition-colors text-gray-900 dark:text-white"
                [ngClass]="{'border-red-500 bg-gray-700 dark:bg-red-900/20': submitted && f['email'].errors}"
              >
            </div>
            <div *ngIf="submitted && f['email'].errors" class="mt-1 text-xs text-red-600 dark:text-red-400">
              <span *ngIf="f['email'].errors['required']">Email is required</span>
              <span *ngIf="f['email'].errors['email']">Please enter a valid email address</span>
            </div>
          </div>

          <!-- Password -->
          <div>
            <label for="password" class="block mb-1.5 text-sm font-medium text-gray-700 dark:text-gray-300">
              Password <span class="text-red-600">*</span>
            </label>
            <div class="relative">
              <div class="absolute inset-y-0 left-0 flex items-center pl-3 pointer-events-none">
                <svg class="w-5 h-5 text-gray-500 dark:text-gray-400" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z" />
                </svg>
              </div>
              <input 
                formControlName="password"
                [type]="passwordVisible ? 'text' : 'password'" 
                id="password" 
                placeholder="••••••••" 
                class="w-full pl-10 pr-10 py-2.5  focus:bg-gray-700 dark:bg-gray-700 border border-gray-300 dark:border-gray-600 rounded-lg focus:ring-2 focus:ring-primary-500 focus:border-primary-500 transition-colors text-gray-900 dark:text-white"
                [ngClass]="{'border-red-500 dark:bg-red-900/20': submitted && f['password'].errors}"
              >
              <button 
                type="button" 
                class="absolute inset-y-0 right-0 flex items-center pr-3 text-gray-600 dark:text-gray-400 hover:text-gray-800 dark:hover:text-gray-200 transition-colors"
                (click)="togglePasswordVisibility()"
              >
                <svg *ngIf="!passwordVisible" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-5 h-5">
                  <path stroke-linecap="round" stroke-linejoin="round" d="M2.036 12.322a1.012 1.012 0 010-.639C3.423 7.51 7.36 4.5 12 4.5c4.638 0 8.573 3.007 9.963 7.178.07.207.07.431 0 .639C20.577 16.49 16.64 19.5 12 19.5c-4.638 0-8.573-3.007-9.963-7.178z" />
                  <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                </svg>
                <svg *ngIf="passwordVisible" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-5 h-5">
                  <path stroke-linecap="round" stroke-linejoin="round" d="M3.98 8.223A10.477 10.477 0 001.934 12C3.226 16.338 7.244 19.5 12 19.5c.993 0 1.953-.138 2.863-.395M6.228 6.228A10.45 10.45 0 0112 4.5c4.756 0 8.773 3.162 10.065 7.498a10.523 10.523 0 01-4.293 5.774M6.228 6.228L3 3m3.228 3.228l3.65 3.65m7.894 7.894L21 21m-3.228-3.228l-3.65-3.65m0 0a3 3 0 10-4.243-4.243m4.242 4.242L9.88 9.88" />
                </svg>
              </button>
            </div>
            <div *ngIf="submitted && f['password'].errors" class="mt-1 text-xs text-red-600 dark:text-red-400">
              <span *ngIf="f['password'].errors['required']">Password is required</span>
            </div>
          </div>

          <!-- Remember Me & Forgot Password -->
          <div class="flex items-center justify-between">
            <div class="flex items-start">
              <div class="flex items-center h-5">
                <input 
                  formControlName="rememberMe"
                  id="rememberMe" 
                  type="checkbox" 
                  class="w-4 h-4 border border-gray-300 rounded bg-gray-50 focus:ring-3 focus:ring-primary-300 dark:bg-gray-700 dark:border-gray-600 dark:focus:ring-primary-600 dark:ring-offset-gray-800"
                >
              </div>
              <div class="ml-3 text-sm">
                <label for="rememberMe" class="text-gray-600 dark:text-gray-400">Remember me</label>
              </div>
            </div>
            <a href="#" class="text-sm font-medium text-primary-600 hover:text-primary-700 dark:text-primary-500 dark:hover:text-primary-400 transition-colors">Forgot password?</a>
          </div>

          <!-- Submit Button -->
          <button 
            type="button" 
            (click)="login()" 
            class="w-full mt-6 flex justify-center items-center py-3 px-4 text-white bg-primary-600 hover:bg-primary-700 focus:ring-4 focus:outline-none focus:ring-primary-300 font-medium rounded-lg text-sm transition-all dark:bg-primary-600 dark:hover:bg-primary-500 dark:focus:ring-primary-800"
          >
            <span>Sign In</span>
            <svg class="ml-2 w-4 h-4" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3" />
            </svg>
          </button>
          
          <!-- Register Link -->
          <div class="text-center mt-6">
            <p class="text-sm text-gray-600 dark:text-gray-400">
              Don't have an account? 
              <button 
                type="button" 
                (click)="register()" 
                class="font-medium text-primary-600 hover:text-primary-700 dark:text-primary-500 dark:hover:text-primary-400 transition-colors"
              >
                Sign up
              </button>
            </p>
          </div>
        </form>
      </div>
    </div>
  </div>
</section>
