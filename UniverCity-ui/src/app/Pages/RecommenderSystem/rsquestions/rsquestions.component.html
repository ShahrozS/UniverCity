<div class="flex flex-col items-center space-y-3 bg-gray-100 p-4 rounded-lg shadow-lg w-full">
    <p class="text-lg font-semibold text-gray-800">{{ question }}</p>
    <div class="flex justify-center items-center space-x-6">
      <label *ngFor="let option of likertOptions" class="flex flex-col items-center cursor-pointer">
        <input 
          type="radio" 
          [value]="option.value" 
          name="question{{questionId}}" 
          [(ngModel)]="selectedValue" 
          (change)="onSelectionChange(option.value)"
          class="hidden"
        />
        <div 
          class="flex items-center justify-center rounded-full transition-all duration-200 border-2 border-transparent"
          [ngClass]="option.size + ' ' + (selectedValue === option.value ? option.activeColor : option.bgColor)">
        </div>
        <span class="text-sm text-gray-700">{{ option.label }}</span>
      </label>
    </div>
  </div>
