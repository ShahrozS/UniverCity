<app-navbar></app-navbar>

<h1 class="text-3xl font-bold text-center text-white my-6 bg-blue-600 py-4">Program Recommender</h1>

<div class="max-w-3xl mx-auto bg-white p-8 shadow-xl rounded-lg">
  <div *ngFor="let question of questions" class="mb-6">
    <app-rsquestions
      [question]="question.rssubquestion"
      [questionId]="question.rssubquestionid"  
      (responseChange)="handleResponse($event)">
    </app-rsquestions>
  </div>

  <button (click)="submitResponses()" 
    class="mt-6 bg-blue-500 text-white px-6 py-3 rounded-lg hover:bg-blue-700 transition">
    Get Recommendations
  </button>

  <div *ngIf="recommendations.length > 0" class="mt-8 p-8 bg-gradient-to-br from-green-100 to-green-50 border border-green-300 rounded-2xl shadow-lg">
    <h2 class="text-2xl font-bold text-green-800 mb-6 text-center animate-fadeIn">
      🎯 Top 3 Recommended Programs
    </h2>
  
    <ul class="space-y-6">
      <li *ngFor="let program of recommendations" 
          class="bg-white p-6 rounded-xl shadow-md hover:shadow-xl transition-all duration-300 flex items-center gap-4 animate-slideUp">
        
        <div class="h-14 w-14 flex items-center justify-center bg-green-200 text-green-800 text-xl font-bold rounded-full">
          {{ program.rssubcategoryname.charAt(0) }}
        </div>
  
        <div>
          <h3 class="text-xl font-semibold text-gray-800">
            {{ program.rssubcategoryname }}
          </h3>
        </div>
  
      </li>
    </ul>
  </div>
  
  
  <div class="mt-10 text-center">
    <button (click)="goBack()" 
      class="inline-block bg-blue-600 text-white px-8 py-3 rounded-full text-lg hover:bg-blue-700 transition duration-300">
      🔙 Go Back
    </button>
  </div>
  
</div>
