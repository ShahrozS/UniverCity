<app-navbar></app-navbar>

<div class="min-h-screen bg-gradient-to-br from-blue-100 to-green-100 flex items-center justify-center py-12 px-4 sm:px-6 lg:px-8">
    <div class="max-w-3xl w-full bg-white p-10 rounded-2xl shadow-2xl">
      <h1 class="text-4xl font-extrabold text-center text-blue-700 mb-8">
        🎯 Your Top 3 Program Recommendations
      </h1>
  
      <ul class="space-y-6">
        <li *ngFor="let program of recommendations" class="bg-blue-50 p-6 rounded-xl shadow-sm hover:shadow-lg transition duration-300">
          <div class="flex items-center">
            <div class="flex-shrink-0">
              <div class="h-12 w-12 rounded-full bg-blue-200 flex items-center justify-center text-blue-800 text-xl font-bold">
                {{ program.rscategoryname.charAt(0) }}
              </div>
            </div>
            <div class="ml-6">
              <h2 class="text-2xl font-semibold text-gray-800">{{ program.rscategoryname }}</h2>
              <p class="text-gray-500 mt-1">
                Get further recommendations for {{ program.rscategoryname }} by taking another quiz.
              </p>
              <button (click)="takeFurtherRecommendations(program)" 
                class="mt-6 bg-blue-500 text-white px-6 py-3 rounded-lg hover:bg-blue-700 transition">
                Get Recommendations
              </button>
            </div>
          </div>
        </li>
      </ul>
  
    </div>
  </div>
